# This repository's toolchain expects a real node_modules tree rather than Yarn's
# Plug'n'Play runtime:
#   * eslint 9.17 deletes entries from `require.cache`, which PnP does not expose on the
#     `require` it hands to modules loaded out of its zip archives.
#   * `tsc` has no native PnP resolution, so dependencies (e.g. @mui/styled-engine) and the
#     automatic `node_modules/@types` inclusion that supplies the ES2015 lib globals both
#     go missing under PnP.
# Applies to the lib/, gallery/ and ssr-tests/ projects. Yarn 1 ignores this file.
nodeLinker: node-modules
