# This repository's projects (lib, gallery, ssr-tests) are built, tested and released
# against a hoisted node_modules tree: CI installs them that way, their .gitignore files
# ignore node_modules, and their tooling (ESLint flat config, jest, webpack) is run as a
# plain Node entry point. Yarn Berry would otherwise default to Plug'n'Play, whose ESM
# loader changes how CJS tooling is loaded and breaks ESLint's config loading.
nodeLinker: node-modules
