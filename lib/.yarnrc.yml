# This project is built for a node_modules layout (see .gitignore and CLAUDE.md).
# Yarn 4 defaults to Plug'n'Play, whose experimental ESM loader makes Node load
# every CommonJS module through the ESM translator. The `require` function it
# synthesizes there lacks `require.cache` and `require.resolve.paths`, which
# breaks jest-resolve and older ESLint config loading. Pin the classic linker.
nodeLinker: node-modules
